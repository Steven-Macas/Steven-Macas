# Genera cada día la "ciudad 3D" del calendario de contribuciones
# (profile-3d-contrib/profile-gointy.svg) con los colores de Gointy.
name: Contribution city 3D

on:
  schedule:
    - cron: "17 5 * * *" # todos los días a las 05:17 UTC
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d-contrib.yml"
      - ".github/profile-3d.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D contribution city"; then
            git push
          fi
